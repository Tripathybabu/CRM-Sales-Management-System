# Local stack: MongoDB as a single-node replica set (required for transactions) + the API.
#   docker compose up -d mongo          -> only the database (run the API with `npm run dev`)
#   docker compose up --build           -> database + API on http://localhost:5000
services:
  mongo:
    image: mongo:7.0
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it is PRIMARY.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '5000:5000'
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/crm_sales?directConnection=true

volumes:
  mongo-data:
